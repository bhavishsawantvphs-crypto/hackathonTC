<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jharkhand Tourism — AI Guide (Demo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #F2F7ED;
    --bg-secondary: #E7F1E3;
    --surface-card: #F8FAF4;
    --forest-deep: #163B27;
    --forest: #2F6B3C;
    --leaf-green: #4C9A45;
    --leaf-green-hover: #3D8537;
    --text-muted: #6E846F;
    --warm-cream: #F7F1E5;
    --border-soft: rgba(47, 107, 60, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg-main);
    color: var(--forest-deep);
    font-family: 'Work Sans', sans-serif;
    line-height: 1.5;
  }

  header {
    background: linear-gradient(180deg, #163B27 0%, #1c4831 100%);
    color: var(--warm-cream);
    padding: 56px 24px 44px;
    text-align: center;
  }

  header .eyebrow {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #A3D89E;
    font-weight: 600;
    margin-bottom: 10px;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0 0 12px;
    color: #FFFFFF;
  }

  header p {
    max-width: 540px;
    margin: 0 auto;
    color: #D2E4D6;
    font-size: 16px;
  }

  main {
    max-width: 680px;
    margin: -32px auto 60px;
    padding: 0 20px;
  }

  #chat-card {
    background: var(--surface-card);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    box-shadow: 0 20px 48px rgba(22, 59, 39, 0.08);
    overflow: hidden;
  }

  #chat-log {
    height: min(480px, 58vh);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--bg-main);
    scroll-behavior: auto;
  }

  .msg {
    max-width: 82%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }

  .msg.bot {
    background: var(--surface-card);
    color: var(--forest-deep);
    border: 1px solid var(--border-soft);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    box-shadow: 0 2px 6px rgba(22, 59, 39, 0.04);
  }

  .msg.user {
    background: var(--leaf-green);
    color: #FFFFFF;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 8px rgba(76, 154, 69, 0.2);
  }

  .msg.bot.thinking {
    color: var(--text-muted);
    font-style: italic;
  }

  .msg.bot ul {
    margin: 4px 0;
    padding-left: 20px;
    white-space: normal;
  }

  .msg.bot li {
    margin: 3px 0;
  }

  .msg.bot p {
    margin: 4px 0;
    white-space: normal;
  }

  .msg.bot strong {
    color: var(--forest-deep);
    font-weight: 600;
  }

  #chat-form {
    display: flex;
    gap: 10px;
    padding: 14px 18px;
    border-top: 1px solid var(--border-soft);
    background: var(--surface-card);
  }

  #chat-input {
    flex: 1;
    padding: 11px 15px;
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    font-family: inherit;
    font-size: 15px;
    background: #FFFFFF;
    color: var(--forest-deep);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  #chat-input:focus {
    outline: none;
    border-color: var(--leaf-green);
    box-shadow: 0 0 0 3px rgba(76, 154, 69, 0.15);
  }

  #chat-form button {
    background: var(--leaf-green);
    color: #FFFFFF;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-weight: 600;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  #chat-form button:hover {
    background: var(--leaf-green-hover);
  }

  #chat-form button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 14px;
    background: var(--bg-main);
  }

  .suggestions button {
    background: var(--surface-card);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    color: var(--forest);
    transition: all 0.15s ease;
  }

  .suggestions button:hover {
    background: var(--bg-secondary);
    border-color: var(--leaf-green);
    color: var(--forest-deep);
  }

  .lang-bar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 18px;
    font-size: 13px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-card);
  }

  #new-chat-btn {
    background: var(--surface-card);
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--forest);
    font-family: inherit;
    cursor: pointer;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s ease;
  }

  #new-chat-btn:hover {
    background: var(--bg-secondary);
    border-color: var(--leaf-green);
    color: var(--forest-deep);
  }

  #lang-select {
    padding: 6px 10px;
    border: 1px solid var(--border-soft);
    border-radius: 8px;
    background: #FFFFFF;
    font-family: inherit;
    font-size: 13px;
    color: var(--forest-deep);
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  #lang-select:focus {
    outline: none;
    border-color: var(--leaf-green);
  }

  footer {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    padding-bottom: 36px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="eyebrow">Jharkhand Tourism Guide</div>
  <h1 id="title">Ask Sohrai about Jharkhand</h1>
  <p id="subtitle">A dedicated AI guide that answers from verified Jharkhand tourism facts — waterfalls, hill stations, wildlife, and cultural festivals.</p>
</header>

<main>
  <div id="chat-card">
    <div class="lang-bar">
      <button id="new-chat-btn" type="button" title="Start a new chat (clears saved history)" aria-label="New Chat">
        <span>＋</span> New Chat
      </button>
      <label for="lang-select" id="lang-label">🌐 Language</label>
      <select id="lang-select">
        <option value="en">English</option>
        <option value="hi">हिंदी (Hindi)</option>
        <option value="mr">मराठी (Marathi)</option>
      </select>
    </div>
    <div id="chat-log"></div>
    <div class="suggestions" id="suggestions">
      <button type="button"></button>
      <button type="button"></button>
      <button type="button"></button>
    </div>
    <form id="chat-form">
      <input id="chat-input" type="text" autocomplete="off" />
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <footer id="footer-text">Frontend + backend demo · answers are grounded in data/jharkhand-info.md</footer>
</main>

<script src="i18n.js"></script>
<script src="chat-widget.js"></script>

</body>
</html>
