<!DOCTYPE html>
<html lang="en" class="h-full bg-[#0F241A]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Unexplored Jharkhand — Account</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            forestDark: '#0F241A',
            forestMoss: '#1B3B2B',
            forestCard: '#183325',
            forestBorder: '#2D5A40',
            sandGold: '#E8C9A3',
            sandGoldDark: '#DFB283',
            warmEcru: '#F3EDE2',
            mutedSage: '#A3B8AC'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    .glass-effect {
      background: rgba(24, 51, 37, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(232, 201, 163, 0.2);
    }

    input:focus {
      outline: none;
      border-color: #E8C9A3 !important;
      box-shadow: 0 0 10px rgba(232, 201, 163, 0.2);
    }

    .hidden-form {
      display: none;
    }
  </style>
</head>

<body class="font-sans text-warmEcru min-h-screen flex items-center justify-center p-6 relative overflow-hidden">

  <!-- Shared Background -->
  <div class="fixed inset-0 pointer-events-none z-0">
    <div
      class="absolute inset-0 bg-cover bg-center bg-no-repeat filter blur-[4px] scale-[1.03] opacity-50"
      style="background-image: url('assets/leaves-bg.jpg');">
    </div>

    <div class="absolute inset-0 bg-gradient-to-b from-[#0F241A] via-[#0F241A]/90 to-[#0B1A13]"></div>
  </div>

  <!-- Content Container -->
  <div class="relative z-10 w-full max-w-md">
    
    <!-- Brand Logo -->
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex flex-col items-center group">

        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#2D5A40] to-[#E8C9A3]/60 border border-[#E8C9A3]/40 flex items-center justify-center text-2xl mb-3 shadow-lg group-hover:scale-110 transition-transform">
          🌿
        </div>

        <span class="text-xs uppercase font-bold tracking-[0.3em] text-sandGold leading-none">
          Unexplored
        </span>

        <span class="text-2xl font-serif font-bold text-warmEcru">
          Jharkhand
        </span>

      </a>
    </div>

    <!-- Auth Card -->
    <div class="glass-effect rounded-[2.5rem] p-8 sm:p-10 shadow-2xl">

      <!-- ========================================= -->
      <!-- LOGIN FORM -->
      <!-- ========================================= -->

      <div id="login-form">

        <h2 class="text-3xl font-serif font-bold mb-2">
          Welcome Back
        </h2>

        <p class="text-mutedSage text-sm mb-8 font-light">
          Enter your credentials to explore hidden gems.
        </p>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">

          <!-- Email -->
          <div>
            <label class="block text-[10px] uppercase font-bold tracking-widest text-sandGold mb-2 px-1">
              Email Address
            </label>

            <input
              type="email"
              placeholder="name@example.com"
              class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all focus:bg-forestDark"
              required
            >
          </div>

          <!-- Password -->
          <div>

            <div class="flex justify-between items-center mb-2 px-1">

              <label class="text-[10px] uppercase font-bold tracking-widest text-sandGold">
                Password
              </label>

              <a
                href="#"
                class="text-[10px] text-mutedSage hover:text-sandGold transition-colors"
              >
                Forgot?
              </a>

            </div>

            <input
              type="password"
              placeholder="••••••••"
              class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all focus:bg-forestDark"
              required
            >

          </div>

          <!-- Login Button -->
          <button
            type="submit"
            class="w-full bg-sandGold text-forestDark font-bold py-4 rounded-xl hover:bg-sandGoldDark transition-all shadow-lg shadow-sandGold/10 mt-4 active:scale-[0.98]"
          >
            Sign In
          </button>

        </form>

        <!-- Switch To Signup -->
        <div class="mt-8 pt-6 border-t border-forestBorder text-center">

          <p class="text-mutedSage text-xs">

            New to the trail?

            <button
              type="button"
              onclick="toggleAuth()"
              class="text-sandGold font-bold hover:underline ml-1"
            >
              Create an Account
            </button>

          </p>

        </div>

      </div>


      <!-- ========================================= -->
      <!-- SIGNUP FORM -->
      <!-- ========================================= -->

      <div id="signup-form" class="hidden-form">

        <h2 class="text-3xl font-serif font-bold mb-2">
          Join the Journey
        </h2>

        <p class="text-mutedSage text-sm mb-8 font-light">
          Start your exploration of the tribal heart of India.
        </p>

        <!-- Signup Form -->
        <form id="signupForm" class="space-y-5">

          <!-- Full Name + Username -->
          <div class="grid grid-cols-2 gap-4">

            <!-- Full Name -->
            <div>

              <label class="block text-[10px] uppercase font-bold tracking-widest text-sandGold mb-2 px-1">
                Full Name
              </label>

              <input
                type="text"
                placeholder="John Doe"
                class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all"
                required
              >

            </div>

            <!-- Username -->
            <div>

              <label class="block text-[10px] uppercase font-bold tracking-widest text-sandGold mb-2 px-1">
                Username
              </label>

              <input
                type="text"
                placeholder="explorer_01"
                class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all"
                required
              >

            </div>

          </div>


          <!-- Email -->
          <div>

            <label class="block text-[10px] uppercase font-bold tracking-widest text-sandGold mb-2 px-1">
              Email Address
            </label>

            <input
              type="email"
              placeholder="travel@example.com"
              class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all"
              required
            >

          </div>


          <!-- Password -->
          <div>

            <label class="block text-[10px] uppercase font-bold tracking-widest text-sandGold mb-2 px-1">
              Create Password
            </label>

            <input
              type="password"
              placeholder="••••••••"
              class="w-full bg-[#0F241A]/50 border border-forestBorder rounded-xl px-5 py-3.5 text-sm transition-all"
              required
            >

          </div>


          <!-- Signup Button -->
          <button
            type="submit"
            class="w-full bg-sandGold text-forestDark font-bold py-4 rounded-xl hover:bg-sandGoldDark transition-all shadow-lg shadow-sandGold/10 mt-4 active:scale-[0.98]"
          >
            Begin Exploration
          </button>

        </form>


        <!-- Switch To Login -->
        <div class="mt-8 pt-6 border-t border-forestBorder text-center">

          <p class="text-mutedSage text-xs">

            Already a member?

            <button
              type="button"
              onclick="toggleAuth()"
              class="text-sandGold font-bold hover:underline ml-1"
            >
              Sign In instead
            </button>

          </p>

        </div>

      </div>

    </div>


    <!-- Back To Home -->
    <a
      href="index.html"
      class="flex items-center justify-center space-x-2 mt-8 text-mutedSage hover:text-sandGold transition-colors text-xs font-medium group"
    >

      <span class="group-hover:-translate-x-1 transition-transform">
        ←
      </span>

      <span>
        Back to Home
      </span>

    </a>

  </div>


  <!-- ========================================= -->
  <!-- AUTH JAVASCRIPT -->
  <!-- ========================================= -->

  <script src="src/auth.js"></script>

  <script>
    function toggleAuth() {

      const loginForm = document.getElementById("login-form");
      const signupForm = document.getElementById("signup-form");

      loginForm.classList.toggle("hidden-form");
      signupForm.classList.toggle("hidden-form");

    }
  </script>

</body>
</html>
